spring.application.name=hydra

# Self-contained test database. Production continues to use PostgreSQL.
spring.datasource.url=jdbc:h2:mem:hydra;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dummy Filebase values so the context can start without real credentials.
filebase.bucket=test-bucket
filebase.access-key=test-access-key
filebase.secret-key=test-secret-key

# Dummy mail values so NotificationService can be created without sending.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
app.mail.from=test@example.com
