<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hydra - User dahsboard</title>
    <link rel="stylesheet" href="css/userDashboard.css" type="text/css">
  </head>
  <body>
    <header>
      <h1>Hydra</h1>
    </header>
    <main>
       <nav class="tabs">
          <button id="plants-tab" class="tab-button">Manage plants</button>
          <button id="household-tab" class="tab-button">Manage household</button>
       </nav>  
        <section id="view-plants"> 
           <div class = "plants-heading">
            <h2>My plants</h2>
            <button id = "add-plant-button" type = "button" class = "add-plant-button">Add plant</button>
           </div>
          <!-- plant cards -->           
           <div id = "plant-card-container"></div>
           <p id="plants-loading" hidden>Loading your plants...</p>
           <p id="plants-empty" hidden>No plants added yet</p>
           <p id="plants-error" hidden></p> <!-- other possible errors -->
        </section>

        <section id="view-household" hidden>
          <!-- Household members -->
        <div id="household-member-container"></div>
        <p id="members-loading" hidden>Loading household memebers...</p>
        <p id="members-empty" hidden>No members added yet. You can invite household members via the invite code above.</p>
        <p id="household-members-error" hidden></p> <!-- other possible errors -->
        </section>
    
    </main>

    <dialog id="edit-plant-dialog" aria-labelledby="edit-plant-title">
      <form id="edit-plant-form">
        <h2 id="edit-plant-title">Edit plant</h2>

        <label for="edit-nickname">Nickname</label>
        <input type="text" id="edit-nickname" name="nickname" required>

        <label for="edit-species">Species (optional)</label>
        <input type="text" id="edit-species" name="species">

        <label for="edit-plant-type">Environment</label>
        <select id="edit-plant-type" name="plantType" required>
          <option value="INDOOR">Indoor</option>
          <option value="OUTDOOR">Outdoor</option>
        </select>

        <label for="edit-min-moisture">Minimum moisture (%)</label>
        <input type="number" id="edit-min-moisture" name="minMoistureLevel" min="0" max="100" required>

        <label for="edit-max-moisture">Maximum moisture (%)</label>
        <input type="number" id="edit-max-moisture" name="maxMoistureLevel" min="0" max="100" required>

        <label for="edit-device-id">Sensor device ID</label>
        <input type="text" id="edit-device-id" name="deviceId" required>
        <p class="field-help">Changing this stops readings until the sensor is reconfigured with the new ID.</p>

        <p id="edit-plant-error" class="form-error" role="alert" hidden></p>

        <div class="dialog-actions">
          <button type="button" id="edit-cancel">Cancel</button>
          <button type="submit" id="edit-save">Save changes</button>
        </div>
      </form>
    </dialog>

    <script type = "module" src = "js/userdashboard.js"> </script>
  </body>
   </html>
