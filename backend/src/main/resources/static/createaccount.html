<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hydra - Create Account</title>
    <link rel="stylesheet" href="css/createHouseStyles.css" type="text/css">
  </head>
  <body>
    <header>Let's create your account ...</header>
    <main>
      <div class = "pane" id="householdNamePane">
        <h1></h1> 
        <form>
          <label for="householdName">What would you like to call your household?</label> <br>
          <input type="text" id="householdName" name="householdName"> <br>  
          <div id="householdNameError" style="color: red; display: none;"></div>
          <button type = submit id = "next6" > Next </button>       
        </form>
      </div>
      <div class = "pane" hidden id="firstNamePane">
        <h1></h1> 
        <form>
          <label for="fname">Your Name</label> <br>
          <input type="text" id="fname" name="fname"> <br>  
          <div id="fnameError" style="color: red; display: none;"></div>
          <button type = submit id = "next1"> Next </button>       
        </form>
      </div>
      <div class = "pane" hidden id="lastNamePane">
        <form>
          <label for="lname">Last Name</label> <br>
          <input type="text" id="lname" name="lname"> <br>
          <div id="lnameError" style="color: red; display: none;"></div>  
          <button type = submit id = "next2"> Next </button>       
        </form>
      </div>
      <div class = "pane" hidden id="emailPane">
        <form>
          <label for="email">Email</label> <br>
          <input type="text" id="email" name="email"> <br> 
          <div id="emailError" style="color: red; display: none;"></div> 
          <button type = submit id = "next3"> Next </button>       
        </form>
      </div>
      <div class = "pane" hidden id="usernamePane">
        <form>
          <label for="username">Username (Can be left blank)</label> <br>
          <input type="text" id="username" name="username"> <br>  
          <button type = submit id = "next4"> Next </button>       
        </form>
      </div>
      <div class = "pane" hidden id="passhashPane">
        <form>
          <label for="passhash">Password</label> <br>
          <input type="password" id="passhash" name="passhash"> <br>  
          <div id="passwordError" style="color: red; display: none;"></div> 
          <button type = submit id = "next5"> Next </button>       
        </form>
      </div>
    </main>
    <script type = "module" src = "js/createAccount.js"></script>
  </body>
   </html>
